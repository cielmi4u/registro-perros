server {
    listen 80;
    client_max_body_size 25m;   # fotos tomadas con el celular

    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;

    # Servicio Elixir (P2). Se conserva el prefijo /f
    location /f/ { proxy_pass http://funcional:4000; }

    # Backend Java del P1: sirve la pagina (/), la API (/api/...) y las fotos
    # (/fotos/...). Sus rutas YA empiezan con /api, por eso aqui no se quita
    # el prefijo (a diferencia del ejemplo del enunciado).
    location / {
        proxy_pass http://backend:8081;
        proxy_read_timeout 120s;   # el primer registro puede tardar mientras Oracle calienta
    }
}
