<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Registro de perros</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="tarjeta">
    <h1>Registro de perros callejeros</h1>
    <p class="subtitulo">¡Ayúdanos a encontrarles un hogar! 🏡</p>


    <form id="formPerro">
      <label>📸 Foto del perro</label>
      <input type="file" id="foto" name="foto" accept="image/*" capture="environment" required>
      <img id="previsualizacion" class="oculto">

      <label>🐶 Nombre</label>
      <input type="text" id="nombre" name="nombre" required>

      <label>🏷️ Raza</label>
      <select id="raza" name="raza">
        <option value="">Selecciona una raza</option>
        <option>Mestizo (criollo)</option>
        <option>Labrador</option>
        <option>Pastor Alemán</option>
        <option>Chihuahua</option>
        <option>Pitbull</option>
        <option>Poodle (Caniche)</option>
        <option>Schnauzer</option>
        <option>Bulldog Francés</option>
        <option>Husky Siberiano</option>
        <option>Yorkshire Terrier</option>
      </select>

      <label>📍 Calle donde se encontró</label>
      <input type="text" id="calle" name="calle" required>

      <label>↔️ Entre calle (opcional)</label>
      <input type="text" id="entreCalle1" name="entreCalle1">

      <label>↔️ Y calle (opcional)</label>
      <input type="text" id="entreCalle2" name="entreCalle2">

      <label>🎨 Color principal</label>
      <select id="colorPrincipal" name="colorPrincipal" required>
        <option value="">Selecciona un color</option>
        <option>Negro</option>
        <option>Blanco</option>
        <option>Café</option>
        <option>Dorado</option>
        <option>Gris</option>
        <option>Manchado (blanco y negro)</option>
        <option>Atigrado</option>
        <option>Canela</option>
        <option>Crema</option>
        <option>Tricolor</option>
      </select>

      <label>🎨 Color secundario (opcional)</label>
      <select id="colorSecundario" name="colorSecundario">
        <option value="">Ninguno</option>
        <option>Negro</option>
        <option>Blanco</option>
        <option>Café</option>
        <option>Dorado</option>
        <option>Gris</option>
        <option>Manchado (blanco y negro)</option>
        <option>Atigrado</option>
        <option>Canela</option>
        <option>Crema</option>
        <option>Tricolor</option>
      </select>

      <label>🎨 Color secundario 2 (opcional)</label>
      <select id="colorTerciario" name="colorTerciario">
        <option value="">Ninguno</option>
        <option>Negro</option>
        <option>Blanco</option>
        <option>Café</option>
        <option>Dorado</option>
        <option>Gris</option>
        <option>Manchado (blanco y negro)</option>
        <option>Atigrado</option>
        <option>Canela</option>
        <option>Crema</option>
        <option>Tricolor</option>
      </select>

      <label>📍 Ubicación (latitud, longitud)</label>
      <div class="fila-ubicacion">
        <input type="number" step="any" id="latitud" name="latitud" placeholder="Latitud">
        <input type="number" step="any" id="longitud" name="longitud" placeholder="Longitud">
      </div>
      <p id="estadoUbicacion" class="ayuda">Obteniendo ubicación...</p>

      <button type="submit">Registrar perro</button>
      <p id="mensaje" class="ayuda"></p>
    </form>
  </div>

  <div class="tarjeta tarjeta-secundaria" id="seccionMapa">
    <h2>🗺️ Mapa de Saltillo</h2>
    <p class="ayuda">Toca un pin (o una foto de la lista de abajo) para ver la información de ese perrito.</p>
    <div id="mapaContenedor">
      <svg id="mapaSvg" viewBox="0 0 400 300" preserveAspectRatio="xMidYMid meet">
        <circle cx="355" cy="38" r="22" class="sol-mapa" />
        <path id="montanasMapa"
          d="M0,300 L0,262 L35,222 L75,258 L115,214 L155,252 L200,202 L245,248 L285,208 L325,252 L365,222 L400,258 L400,300 Z" />
        <text x="200" y="60" class="etiqueta-mapa" text-anchor="middle">SALTILLO</text>
        <g id="capaPines"></g>
      </svg>
    </div>
    <div id="infoPin" class="info-pin oculto"></div>
  </div>

  <div class="tarjeta tarjeta-secundaria">
    <h2>🐕 Perritos registrados</h2>
    <div id="listaPerros" class="lista-perros"></div>
  </div>

  <script src="app.js"></script>
</body>
</html>
